name: frontend
on:
  pull_request:
  push:
    branches:
      - main
      - release/*

jobs:
  frontend-cache:
    runs-on: ubuntu-latest
    outputs:
      yarn-cache-key: ${{ steps.set-cache-key.outputs.cache-key}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set-cache-key
        id: set-cache-key
        run: echo "cache-key=derrick-ui-v1-${{ hashFiles('ui/yarn.lock', 'ui/lib/**') }}" | tee -a "${GITHUB_OUTPUT}"

      - name: Initialize UI cache
        id: ui-cache
        uses: actions/cache@v4
        with:
          key: "${{ steps.set-cache-key.outputs.cache-key }}"
          path: |- 
            ui/node_modules
            ui/lib/node_modules

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.ui-cache.outputs.cache-hit == false
        with:
          node-version: 14

      - name: install yarn packages
        if: steps.ui-cache.outputs.cache-hit == false
        run: yarn install
        working-directory: ui


  frontend-lint:
    runs-on: ubuntu-latest
    needs:
      - frontend-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 14

      - name: restore-cache
        uses: actions/cache@v4
        with:
          key: ${{ needs.frontend-cache.outputs.yarn-cache-key }}
          path: |- 
            ui/node_modules
            ui/lib/node_modules

      - run: yarn lint
        working-directory: ui

  ember-tests:
    runs-on: ubuntu-latest
    env:
      EMBER_TEST_REPORT: test-results/report-oss.xml
      EMBER_TEST_PARALLEL: 'true'
    needs:
      - frontend-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 14

      - name: restore-cache
        uses: actions/cache@v4
        with:
          key: ${{ needs.frontend-cache.outputs.yarn-cache-key }}
          path: |- 
            ui/node_modules
            ui/lib/node_modules

      - name: build:test
        run: yarn build:test
        working-directory: ui
      
      - name: test:ember:ci
        run: yarn test:ember:ci
        working-directory: ui

      - uses: actions/upload-artifact@v4
        with:
          path: ui/test-results

permissions:
  contents: read
