name: "Pull Request Labeler"

on:
  - pull_request_target

permissions:
  contents: read
  pull-requests: write

jobs:
  # Dependabot dependency bumps do not need release-note changelog entries.
  dependabot-no-changelog:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c699beb48 # v7.0.1
        with:
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            if (labels.includes('pr/no-changelog')) {
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['pr/no-changelog'],
            });

  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@0967ca812e7fdc8f5f71402a1b486d5bd061fe20 # v4.2.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
