name: Notify Integration Release (Manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "A semver"
        default: 0.0.1
        required: false
      branch:
        description: "A branch or SHA"
        default: "main"
        required: false
jobs:
  notify-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        integration_identifier:
          - "derrick/nomatronio/aws-alb"
          - "derrick/nomatronio/aws-ami"
          - "derrick/nomatronio/aws-ec2"
          - "derrick/nomatronio/aws-ecr-pull"
          - "derrick/nomatronio/aws-ecr"
          - "derrick/nomatronio/aws-ecs"
          - "derrick/nomatronio/aws-lambda"
          - "derrick/nomatronio/lambda-function-url"
          - "derrick/nomatronio/aws-ssm"
          - "derrick/nomatronio/azure-container-instance"
          - "derrick/nomatronio/consul"
          - "derrick/nomatronio/docker-pull"
          - "derrick/nomatronio/docker-ref"
          - "derrick/nomatronio/docker"
          - "derrick/nomatronio/exec"
          - "derrick/nomatronio/files"
          - "derrick/nomatronio/google-cloud-run"
          - "derrick/nomatronio/helm"
          - "derrick/nomatronio/kubernetes-apply"
          - "derrick/nomatronio/kubernetes"
          - "derrick/nomatronio/nomad-jobspec-canary"
          - "derrick/nomatronio/nomad-jobspec"
          - "derrick/nomatronio/nomad"
          - "derrick/nomatronio/pack"
          - "derrick/nomatronio/packer"
          - "derrick/nomatronio/terraform-cloud"
          - "derrick/nomatronio/vault"
    steps:
      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Checkout integration-release-action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hashicorp/integration-release-action
          path: ./integration-release-action
      - name: Notify Release
        uses: ./integration-release-action
        with:
          integration_identifier: ${{ matrix.integration_identifier }}
          release_version: ${{ github.event.inputs.version }}
          release_sha: ${{ github.event.inputs.branch }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
permissions:
  contents: read
